name: Website delivery readiness
on:
  push:
    branches:
      - codex/mac-signed-rebuild-20261019
    paths:
      - .github/workflows/website-delivery-readiness.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect existing Cloudflare Pages delivery configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").trim();
          const account = (process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const result = { tokenConfigured: Boolean(token), accountConfigured: Boolean(account), ready: false };
          if (token && /^[a-f0-9]{32}$/i.test(account)) {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/yansilu", {
              headers: { Authorization: "Bearer " + token }, signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            result.httpStatus = response.status;
            result.ready = response.ok && data.success === true;
            if (result.ready) {
              const p = data.result;
              result.project = p.name;
              result.productionBranch = p.production_branch;
              result.sourceType = p.source?.type || "direct-upload";
              result.domains = p.domains;
              result.latestDeployment = { url: p.latest_deployment?.url, stage: p.latest_deployment?.latest_stage?.status,
                commit: p.latest_deployment?.deployment_trigger?.metadata?.commit_hash };
            }
          }
          console.log(JSON.stringify(result));
          JS
